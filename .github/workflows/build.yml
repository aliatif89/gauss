name: Build Plugin

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew makePlugins
              - name: Debug Gradle Configuration
        run: |
          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "Gradle version:"
          ./gradlew --version
          echo "Build file:"
          head -20 build.gradle
                - name: Build Plugin
        run: ./gradlew makePlugins --stacktrace
