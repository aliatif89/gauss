plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.github.recloudstream.gradle' version 'master-SNAPSHOT'
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

android {
    namespace "com.lagradost.cloudstream3.plugins"
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }

    kotlinOptions {
        jvmTarget = '18'
    }
}

cloudstream {
    setPip("gauss")
}
